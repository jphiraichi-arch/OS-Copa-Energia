[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osapp"
version = "0.1.0"
description = "Sistema de OS - ordens de serviço para manutenção e operação"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet[web]>=1.1,<1.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["osapp"]
